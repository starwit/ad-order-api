openapi: 3.1.0
info:
  description: |
    REST API for submitting and managing ride orders to a vehicle's autonomous driving (AD) stack, and for querying current vehicle status and component inventory. Runs within the vehicle's onboard network and serves exactly one vehicle. Onboard HMIs reach it directly; backend systems reach it via an API gateway which handles vehicle identification and routing.
  license:
    name: GNU Affero General Public License v3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: AD Stack Ride Order API
  version: 1.0.0
servers:
- description: Onboard network endpoint
  url: http://localhost:8080/api/v1
tags:
- description: Creating and managing ride orders
  name: Orders
- description: Vehicle status and software component inventory
  name: Vehicle
paths:
  /orders:
    get:
      description: "Returns all orders, optionally filtered by status."
      operationId: listOrders
      parameters:
      - description: Filter by order status
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/OrderStatus"
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
          description: Paginated list of ride orders
      summary: List all ride orders
      tags:
      - Orders
      x-accepts:
      - application/json
      x-tags:
      - tag: Orders
    post:
      description: |
        Submits a new ride order to the AD stack. The stack evaluates feasibility immediately; the returned order may already be in `rejected` state if the request cannot be fulfilled.
      operationId: createOrder
      requestBody:
        content:
          application/json:
            example:
              source:
                type: backend
                id: fleet-manager-1
              stops:
              - location:
                  latitude: 52.4226
                  longitude: 10.7865
                  label: Depot Gate B
              priority: normal
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideOrder"
          description: Order created; inspect `status` field for AD stack evaluation
            result
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An active order already exists and queuing is not supported
      summary: Create a new ride order
      tags:
      - Orders
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Orders
  /orders/{orderId}:
    get:
      operationId: getOrder
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideOrder"
          description: Ride order details
        "404":
          $ref: "#/components/responses/OrderNotFound"
      summary: Get a specific ride order
      tags:
      - Orders
      x-accepts:
      - application/json
      x-tags:
      - tag: Orders
    parameters:
    - $ref: "#/components/parameters/OrderId"
    patch:
      description: |
        Updates a pending or accepted order. Only `stops`, `priority`, and `constraints` may be updated. Updates to an `in_progress` order are limited to appending new stops; changes to already-reached stops or the priority of an active drive are rejected with 409.
      operationId: updateOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideOrder"
          description: Updated order
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Order is in a state that does not allow the requested update
      summary: Update a ride order
      tags:
      - Orders
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Orders
  /orders/{orderId}/cancel:
    parameters:
    - $ref: "#/components/parameters/OrderId"
    post:
      description: |
        Requests cancellation of an active order. The AD stack brings the vehicle to a safe stop before transitioning the order to `cancelled`, so the transition is asynchronous.
      operationId: cancelOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
        required: false
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideOrder"
          description: Cancellation request accepted; order transitions asynchronously
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Order is already in a terminal state
      summary: Cancel a ride order
      tags:
      - Orders
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Orders
  /vehicle/status:
    get:
      description: |
        Returns a snapshot of current vehicle state: AD stack mode, position, kinematics (speed, heading), and battery status. This is the same data structure published on the MQTT /vehicle/status topic.
      operationId: getVehicleStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleStatus"
          description: Current vehicle status snapshot
      summary: Get current vehicle status
      tags:
      - Vehicle
      x-accepts:
      - application/json
      x-tags:
      - tag: Vehicle
  /vehicle/components:
    get:
      description: |
        Returns the list of all software components running in the AD stack, including their names, versions, and current health status.
      operationId: getComponentList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentList"
          description: Software component inventory
      summary: Get software component inventory
      tags:
      - Vehicle
      x-accepts:
      - application/json
      x-tags:
      - tag: Vehicle
components:
  parameters:
    OrderId:
      description: Unique identifier of the ride order
      explode: false
      in: path
      name: orderId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Request payload is invalid or missing required fields
    OrderNotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: No order with the given ID exists
  schemas:
    GeoPoint:
      description: A geographic position with optional heading
      properties:
        latitude:
          example: 52.4226
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          example: 10.7865
          format: double
          maximum: 180
          minimum: -180
          type: number
        headingDegrees:
          description: Compass heading in degrees (0 = north)
          example: 270.0
          format: double
          maximum: 360
          minimum: 0
          type: number
        label:
          description: Optional human-readable name for the location
          example: Gate B - Bay 3
          type: string
      required:
      - latitude
      - longitude
    OrderSource:
      description: Identifies the system or client that issued an order
      properties:
        type:
          description: Whether the order originated from an onboard HMI or a backend
            system
          enum:
          - onboard_hmi
          - backend
          type: string
        id:
          description: Identifier of the specific HMI instance or backend service
          example: hmi-driver-console-1
          type: string
      required:
      - id
      - type
    OrderStatus:
      description: |
        Lifecycle status of a ride order. Flow: pending -> accepted -> in_progress -> completed. Alternate terminals: rejected, cancelled, failed.
      enum:
      - pending
      - accepted
      - rejected
      - in_progress
      - completed
      - cancelled
      - failed
      type: string
    RejectionReason:
      description: Machine-readable reason code when an order is rejected or fails
      enum:
      - target_unreachable
      - vehicle_unavailable
      - vehicle_in_fault_state
      - outside_operational_domain
      - other
      type: string
    Stop:
      description: A single waypoint in an order's route
      properties:
        stopId:
          description: Assigned by the AD stack when the stop is added
          format: uuid
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        sequenceNumber:
          description: |
            Position of this stop in the route. 0 is the first stop after departure. The AD stack may reorder stops if not supplied.
          minimum: 0
          type: integer
        scheduledArrival:
          description: Optional target arrival time at this stop
          format: date-time
          type: string
        status:
          default: pending
          enum:
          - pending
          - reached
          - skipped
          type: string
      required:
      - location
    AvoidArea:
      description: A geofenced area the vehicle should avoid
      properties:
        label:
          type: string
        polygon:
          description: Closed polygon defined as an ordered list of GeoPoints
          items:
            $ref: "#/components/schemas/GeoPoint"
          minItems: 3
          type: array
          default: null
      required:
      - polygon
    DriveConstraints:
      description: Optional operational constraints scoped to a single order
      properties:
        maxSpeedKph:
          description: Speed cap for this order in km/h
          minimum: 0
          type: number
        avoidAreas:
          description: "Geofenced areas to avoid, e.g. zones under maintenance"
          items:
            $ref: "#/components/schemas/AvoidArea"
          type: array
          default: null
    RideOrder:
      description: A ride order and its current execution state
      properties:
        orderId:
          format: uuid
          type: string
        clientOrderId:
          description: Optional client-supplied idempotency key / external reference
          example: fleet-job-88421
          type: string
        source:
          $ref: "#/components/schemas/OrderSource"
        stops:
          description: |
            Ordered list of waypoints the vehicle shall visit. Must contain at least one stop (the final destination). The vehicle always departs from its current position at order acceptance time.
          items:
            $ref: "#/components/schemas/Stop"
          minItems: 1
          type: array
          default: null
        startPosition:
          $ref: "#/components/schemas/GeoPoint"
        status:
          $ref: "#/components/schemas/OrderStatus"
        rejectionReason:
          $ref: "#/components/schemas/RejectionReason"
        statusDetail:
          description: "Free-text detail, e.g. fault description on failure"
          type: string
        priority:
          default: normal
          enum:
          - normal
          - high
          type: string
        constraints:
          $ref: "#/components/schemas/DriveConstraints"
        createdAt:
          format: date-time
          type: string
        acceptedAt:
          format: date-time
          type: string
        startedAt:
          description: When the AD stack began physically executing the drive
          format: date-time
          type: string
        completedAt:
          format: date-time
          type: string
        estimatedArrival:
          description: "Current ETA at the final stop, updated while in_progress"
          format: date-time
          type: string
        distanceRemainingMeters:
          description: "Remaining distance to final stop, updated while in_progress"
          type: number
      required:
      - createdAt
      - orderId
      - source
      - status
      - stops
    OrderList:
      description: Paginated list of ride orders
      properties:
        items:
          items:
            $ref: "#/components/schemas/RideOrder"
          type: array
          default: null
        total:
          description: Total number of orders matching the applied filter
          type: integer
      required:
      - items
      - total
    CreateOrderRequest:
      description: Payload to create a new ride order
      properties:
        source:
          $ref: "#/components/schemas/OrderSource"
        stops:
          description: |
            Ordered list of stops the vehicle shall visit. Must contain at least one stop (the final destination).
          items:
            $ref: "#/components/schemas/Stop"
          minItems: 1
          type: array
          default: null
        priority:
          default: normal
          enum:
          - normal
          - high
          type: string
        clientOrderId:
          description: Optional idempotency key / external system reference
          example: fleet-job-88421
          type: string
        notBeforeTimestamp:
          description: Earliest time at which the AD stack should begin executing
            the order
          format: date-time
          type: string
        constraints:
          $ref: "#/components/schemas/DriveConstraints"
      required:
      - source
      - stops
    UpdateOrderRequest:
      description: |
        Partial update to a ride order. Only supplied fields are modified. At least one field must be present.
      properties:
        stops:
          description: |
            Replacement stop list. For in_progress orders only appending new stops (higher sequence numbers) is permitted.
          items:
            $ref: "#/components/schemas/Stop"
          minItems: 1
          type: array
          default: null
        priority:
          enum:
          - normal
          - high
          type: string
        constraints:
          $ref: "#/components/schemas/DriveConstraints"
    CancelOrderRequest:
      description: Optional payload when cancelling a ride order
      properties:
        reason:
          description: Free-text reason for cancellation (logged/audited only)
          example: Operator requested stop for maintenance
          type: string
    AdStackMode:
      description: Current operational mode of the AD stack
      enum:
      - initializing
      - idle
      - executing_order
      - manual_override
      - fault
      type: string
    BatteryStatus:
      description: Current battery / energy storage status
      properties:
        stateOfChargePercent:
          description: State of charge as a percentage
          example: 73.4
          format: double
          maximum: 100
          minimum: 0
          type: number
        estimatedRangeKm:
          description: Estimated remaining range in kilometres
          example: 142.0
          format: double
          minimum: 0
          type: number
        charging:
          description: Whether the vehicle is currently charging
          example: false
          type: boolean
        healthPercent:
          description: Battery health as a percentage of design capacity
          example: 96.1
          format: double
          maximum: 100
          minimum: 0
          type: number
      required:
      - stateOfChargePercent
    VehicleKinematics:
      description: Current motion state of the vehicle
      properties:
        speedKph:
          description: Current speed in km/h
          example: 24.5
          format: double
          minimum: 0
          type: number
        headingDegrees:
          description: Current compass heading in degrees (0 = north)
          example: 90.0
          format: double
          maximum: 360
          minimum: 0
          type: number
        accelerationMps2:
          description: Current longitudinal acceleration in m/s²
          example: 0.3
          format: double
          type: number
      required:
      - headingDegrees
      - speedKph
    VehicleStatus:
      description: |
        Complete snapshot of the vehicle's current status. Published on the MQTT /vehicle/status topic and also returned by the REST status endpoint.
      properties:
        adStackMode:
          $ref: "#/components/schemas/AdStackMode"
        adStackReady:
          description: Whether the AD stack can currently accept new orders
          type: boolean
        activeOrderId:
          description: "ID of the order currently being executed, if any"
          format: uuid
          type: string
        kinematics:
          $ref: "#/components/schemas/VehicleKinematics"
        position:
          $ref: "#/components/schemas/GeoPoint"
        battery:
          $ref: "#/components/schemas/BatteryStatus"
        timestamp:
          description: Time at which this snapshot was captured
          format: date-time
          type: string
      required:
      - adStackMode
      - battery
      - kinematics
      - position
      - timestamp
    SoftwareComponent:
      description: A single versioned software component running in the AD stack
      properties:
        name:
          description: Component name
          example: perception-module
          type: string
        version:
          description: Semantic version string
          example: 2.4.1
          type: string
        buildId:
          description: Optional build or commit identifier
          example: git-a3f9c12
          type: string
        status:
          default: unknown
          enum:
          - running
          - degraded
          - stopped
          - unknown
          type: string
        description:
          description: Optional human-readable description of the component
          example: LiDAR-based obstacle detection pipeline
          type: string
      required:
      - name
      - version
    ComponentList:
      description: Full inventory of software components in the AD stack
      properties:
        components:
          items:
            $ref: "#/components/schemas/SoftwareComponent"
          type: array
          default: null
        timestamp:
          description: Time at which the inventory was captured
          format: date-time
          type: string
      required:
      - components
      - timestamp
    Error:
      properties:
        code:
          example: ORDER_NOT_FOUND
          type: string
        message:
          example: No order with the given ID exists.
          type: string
        details:
          additionalProperties: true
          type: object
      required:
      - code
      - message
