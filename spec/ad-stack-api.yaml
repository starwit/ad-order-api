openapi: 3.1.0
info:
  title: AD Stack Ride Order API
  description: >
    API for submitting and managing ride orders to a vehicle's autonomous driving
    (AD) stack. This API runs within the vehicle's onboard network and serves
    exactly one vehicle. Onboard HMIs reach it directly; external backend systems
    reach it via an API gateway, which is responsible for vehicle identification
    and routing (e.g. mapping a fleet vehicle ID to this vehicle's network endpoint).
    This API is purely operational (vehicle/route oriented) and does not carry any
    customer or passenger data.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Onboard network endpoint (reached directly by onboard HMI, or via API gateway from backend systems)

tags:
  - name: Orders
    description: Creating and managing ride orders
  - name: Vehicle State
    description: Current AD stack / vehicle status relevant to orders

paths:
  /orders:
    post:
      tags: [Orders]
      summary: Submit a new ride order
      description: >
        Creates a new ride order instructing the AD stack to drive the vehicle
        from its current position to the specified target location. The AD stack
        evaluates feasibility and responds with the created order, which may
        already be in a rejected state if infeasible.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideOrderRequest'
      responses:
        '201':
          description: Order created (status reflects initial AD stack evaluation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Vehicle already has an active order and does not support queuing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Orders]
      summary: List ride orders
      operationId: listOrders
      parameters:
        - name: status
          in: query
          description: Filter by order status
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of ride orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RideOrder'
                  total:
                    type: integer
                required: [items, total]

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    get:
      tags: [Orders]
      summary: Get a specific ride order
      operationId: getOrder
      responses:
        '200':
          description: Ride order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOrder'
        '404':
          $ref: '#/components/responses/OrderNotFound'

  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Orders]
      summary: Cancel a ride order
      description: >
        Requests cancellation of an active (accepted or in-progress) order.
        Cancellation is not guaranteed to be immediate; the AD stack must bring
        the vehicle to a safe stop before the order transitions to `cancelled`.
      operationId: cancelOrder
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Free-text reason for cancellation, for logging/audit purposes
                  example: "Operator requested stop for maintenance"
      responses:
        '202':
          description: Cancellation request accepted; order will transition asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOrder'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: Order is already in a terminal state and cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/active:
    get:
      tags: [Orders]
      summary: Get the currently active order, if any
      description: >
        Convenience endpoint returning the single order currently being executed
        or pending execution by the AD stack (status `accepted` or `in_progress`).
      operationId: getActiveOrder
      responses:
        '200':
          description: Active order, if one exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOrder'
        '204':
          description: No active order

  /vehicle/state:
    get:
      tags: [Vehicle State]
      summary: Get current AD stack state relevant to order execution
      description: >
        Returns the vehicle's current position and AD stack readiness, useful
        for clients deciding whether/where to submit a new order.
      operationId: getVehicleState
      responses:
        '200':
          description: Current vehicle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleState'

components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Unique identifier of the ride order
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request payload is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    OrderNotFound:
      description: No such order exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    OrderSource:
      type: object
      description: Identifies the system/client that issued the order
      required: [type, id]
      properties:
        type:
          type: string
          enum: [onboard_hmi, backend]
          description: Whether the order originated from an onboard HMI or a backend system (arriving via the API gateway)
        id:
          type: string
          description: Identifier of the specific HMI instance or backend service/client
          example: "hmi-driver-console-1"

    GeoPoint:
      type: object
      description: A geographic position, optionally with heading
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.4226
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 10.7865
        headingDegrees:
          type: number
          format: double
          minimum: 0
          maximum: 360
          description: Compass heading in degrees (0 = north), if a specific approach/departure orientation is required
          example: 90.0
        label:
          type: string
          description: Optional human-readable name for the location (e.g. a known waypoint or stop)
          example: "Gate B - Bay 3"

    RideOrderRequest:
      type: object
      description: Payload to request a new ride order
      required: [source, target]
      properties:
        source:
          $ref: '#/components/schemas/OrderSource'
        target:
          $ref: '#/components/schemas/GeoPoint'
          description: Destination the AD stack should drive to. Current position is taken from the vehicle's live state at acceptance time, not supplied by the client.
        priority:
          type: string
          enum: [normal, high]
          default: normal
          description: Optional priority hint, relevant if a queuing mechanism is added later
        clientOrderId:
          type: string
          description: Optional idempotency key / client-side reference for correlating with external systems (e.g. a backend job ID)
          example: "fleet-job-88421"
        notBeforeTimestamp:
          type: string
          format: date-time
          description: Optional earliest time at which the AD stack should begin executing the order
        constraints:
          type: object
          description: Optional operational constraints for the drive
          properties:
            maxSpeedKph:
              type: number
              minimum: 0
              description: Optional speed cap for this order
            avoidAreas:
              type: array
              description: Optional list of areas to avoid, e.g. geofenced zones under maintenance
              items:
                type: object
                properties:
                  label:
                    type: string
                  polygon:
                    type: array
                    description: Closed polygon as a list of points
                    items:
                      $ref: '#/components/schemas/GeoPoint'

    OrderStatus:
      type: string
      description: >
        Lifecycle status of a ride order.
        `pending` -> `accepted` -> `in_progress` -> `completed`,
        with `rejected`, `cancelled` and `failed` as alternative/terminal outcomes.
      enum:
        - pending
        - accepted
        - rejected
        - in_progress
        - completed
        - cancelled
        - failed

    RejectionReason:
      type: string
      enum:
        - target_unreachable
        - vehicle_unavailable
        - vehicle_in_fault_state
        - outside_operational_domain
        - other
      description: Machine-readable reason code when status is `rejected` or `failed`

    RideOrder:
      type: object
      description: A ride order and its current execution state
      required: [orderId, source, target, status, createdAt]
      properties:
        orderId:
          type: string
          format: uuid
        clientOrderId:
          type: string
        source:
          $ref: '#/components/schemas/OrderSource'
        target:
          $ref: '#/components/schemas/GeoPoint'
        startPosition:
          allOf:
            - $ref: '#/components/schemas/GeoPoint'
          description: Position of the vehicle at the time the order was accepted, recorded by the AD stack
        status:
          $ref: '#/components/schemas/OrderStatus'
        rejectionReason:
          $ref: '#/components/schemas/RejectionReason'
        statusDetail:
          type: string
          description: Free-text detail, e.g. fault description when status is `failed`
        priority:
          type: string
          enum: [normal, high]
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          description: When the AD stack began physically executing the drive
        completedAt:
          type: string
          format: date-time
        estimatedArrival:
          type: string
          format: date-time
          description: AD stack's current ETA estimate, updated while in_progress
        distanceRemainingMeters:
          type: number
          description: Remaining distance estimate while in_progress

    VehicleState:
      type: object
      required: [position, adStackReady, timestamp]
      properties:
        position:
          $ref: '#/components/schemas/GeoPoint'
        adStackReady:
          type: boolean
          description: Whether the AD stack is currently able to accept new orders
        adStackMode:
          type: string
          enum: [idle, executing_order, fault, manual_override, initializing]
        activeOrderId:
          type: string
          format: uuid
          description: ID of the order currently being executed, if any
        timestamp:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "TARGET_UNREACHABLE"
        message:
          type: string
          example: "The requested target location is outside the vehicle's operational domain."
        details:
          type: object
          additionalProperties: true